[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vm-placement-fog-classifier"
version = "1.0.0"
description = "Virtual machine placement in energy-aware load balancers using fog computing classifiers"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Danial Pahlavan", email = "danialpahlavan@gmail.com" },
]
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "scikit-learn>=1.3.0",
    "pandas>=2.0.0",
    "matplotlib>=3.7.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6.0",
    "pytest>=7.0.0",
]

[tool.ruff]
target-version = "py310"
line-length = 100
